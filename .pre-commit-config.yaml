# Optional: `pip install pre-commit && pre-commit install` runs these before
# every commit. Local hooks, so they use the ruff and pytest of your own
# environment (`make install`) and fetch nothing.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: no-secrets
        name: no credential in the committed files
        entry: python -m pytest -q tests/test_no_secrets.py
        language: system
        pass_filenames: false
        always_run: true
