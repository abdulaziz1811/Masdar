<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>مصدر — منصة البيانات الإحصائية الرسمية</title>
<meta name="description" content="البحث في البيانات الإحصائية الرسمية للمملكة العربية السعودية.">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body class="is-landing">
<a class="skip" href="#input">انتقل إلى خانة السؤال</a>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="9" class="mark-bg"/>
      <path d="M9 21.5V14M14.3 21.5V10.5M19.6 21.5V16.5M24.9 21.5V12" class="mark-bars"/>
    </svg>
    <div class="brand-text">
      <strong>مصدر</strong>
      <span>منصة البيانات الإحصائية الرسمية</span>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="badge" id="ready-badge" role="status" hidden></span>
    <span class="badge badge-muted" id="mode-badge" hidden></span>
    <span class="badge" id="ai-badge" hidden></span>
    <button type="button" class="icon-btn" id="theme" aria-label="تبديل المظهر" title="تبديل المظهر">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><g class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
    </button>
    <button type="button" class="btn btn-ghost" id="reset">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>محادثة جديدة</span>
    </button>
  </div>
</header>

<main id="scroller" tabindex="-1">
  <div class="page">
    <section class="hero" id="landing" aria-labelledby="hero-title">
      <h1 id="hero-title">البحث في البيانات الإحصائية الرسمية</h1>
      <div class="hero-composer" id="hero-slot"></div>
      <div class="examples" id="examples" aria-label="أسئلة مقترحة"></div>
      <p class="source-line" id="source-line" hidden></p>
    </section>

    <div class="thread" id="thread" aria-live="polite"></div>
  </div>
</main>

<footer class="dock" id="dock">
  <form class="composer" id="form" autocomplete="off">
    <label class="visually-hidden" for="input">اكتب سؤالك</label>
    <textarea id="input" rows="1" maxlength="500"
      placeholder="اكتب الموضوع والسنة والتفصيل المطلوب"></textarea>
    <button class="send" id="send" type="submit" aria-label="إرسال">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>
    </button>
  </form>
</footer>

<dialog class="unlock" id="unlock" aria-labelledby="unlock-title">
  <form id="unlock-form" method="dialog">
    <h2 id="unlock-title">رمز الدخول</h2>
    <p>يلزم رمز للدخول إلى المنصة.</p>
    <input id="unlock-code" type="password" autocomplete="current-password" required aria-label="رمز الدخول">
    <p class="unlock-error" id="unlock-error" hidden>الرمز غير صحيح.</p>
    <button class="btn btn-primary" type="submit">دخول</button>
  </form>
</dialog>
</body>
</html>
