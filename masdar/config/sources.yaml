  - id: gastat_db
    name_ar: قاعدة بيانات الهيئة العامة للإحصاء
    name_en: GASTAT statistical database
    operator_ar: الهيئة العامة للإحصاء
    operator_en: GASTAT
    base_url: https://database.stats.gov.sa
    adapter: gastat_api
    authority: 100
    # VERIFIED by direct call on 2026-09-27: HTTP 200, application/json,
    # anonymous. See masdar/sources/adapters/gastat_api.py for the shapes.
    api_verified: true
    access_checked: "2026-09-27"
    access_notes_ar: >-
      واجهة مؤشرات مفتوحة بلا مفتاح. تم التحقق من cardsinfo مباشرةً (يعيد
      {"info": [...]} مع ar_title/en_title وfrequency)، ومن أن indicators/public
      يعيد JSON بحالة 200 (نحو 2600 مؤشر، ~4.5 ميغابايت). لا يوجد بحث من جهة
      الخدمة — جدار الحماية يرفض معاملات الاستعلام على الفهرس — فالتصفية تحدث
      محلياً بعد جلب الفهرس مرة واحدة. حقول frequency تعني التكرار (سنوي/شهري)
      ولا تدل على السنوات المتاحة، فالسنوات تُستخرج من البيانات نفسها.
    api:
      catalog: /gastatapi/portal/api/v1/indicators/public
      headlines: /gastatapi/portal/api/v1/indicators/cardsinfo
      observations: /gastatapi/portal/api/v1/indicators/getDataForChart
    topics: [population, labour, prices, gdp, trade, education, health, tourism,
             transport, environment, housing, energy, electricity, water, ict,
             agriculture, finance, business, research, culture]

  - id: gastat_cdata
    name_ar: واجهة إحصاءات الهيئة العامة للإحصاء (cdata)
    name_en: GASTAT cdata statistics API
    operator_ar: الهيئة العامة للإحصاء
    operator_en: GASTAT
    base_url: https://api.stats.gov.sa
    site_url: https://www.stats.gov.sa/ar
    adapter: gastat_cdata
    authority: 100
    # VERIFIED by direct call on 2026-09-27: HTTP 200, application/json, and
    # anonymous -- the "Public" APIs need no key. Spec is OpenAPI 3.0, served
    # from the GASTAT developer portal.
    api_verified: true
    access_checked: "2026-09-27"
    access_notes_ar: >-
      أفضل مسار بيانات مؤكَّد حتى الآن. التجميع يحدث في الخادم عبر
      dimensions[]، فطلب "حسب المناطق" يُنفَّذ مباشرة لا بمعالجة لاحقة.
      واستعلام dimensions[]=YEAR وحده يُعيد صفاً لكل سنة متاحة، فيُستخرج
      نطاق التغطية بتكلفة صفوف قليلة وبدليل من المصدر نفسه. الأعمدة موسومة
      بدورها: YEAR_TIME للفترة، و*_OBSV للقيم، و*_ARAB/*_ENGL/*_CODE
      لمسميات التصنيفات. تدعم أيضاً format=CSV وHTML و$top/$skip/$orderby.
      الواجهات العامة لا تحتاج مفتاحاً؛ يُرسل المفتاح فقط إن كان مُعيَّناً
      في البيئة، لواجهة تطلبه.
    api:
      dataset_path: /v1/stats/{id}
      # Every OpenAPI file in this directory contributes its datasets. This is
      # the normal way to add them: `masdar import-spec <file>`.
      spec_dir: specs/gastat
      # Hand-declared datasets. These win over a spec entry with the same id,
      # so curated titles and keywords survive a re-import.
      datasets:
        - id: DPV_HES_EHE_IT_HES0301
          title_ar: المساكن المتصلة بالكهرباء حسب مصدر الكهرباء ونوع الحيازة والمنطقة الإدارية
          title_en: >-
            Housing units with electricity connection by network, tenure type
            and region
          description: >-
            نسبة المساكن المتصلة بالكهرباء من إجمالي المساكن. السنوات المتاحة
            عند الفحص: 2017-2019 و2021-2022 (لا يوجد 2020).
          keywords: كهرباء الطاقة الكهربائية مساكن توصيل الكهرباء
          dimensions: [ELECTRICITY_NETWORK_TYPE, HOUSE_TYPE, POSSESSION_TYPE,
                       REGION, YEAR]
          topics: [electricity, energy, housing]
        - id: DPV_HES_EHE_IT_HES0303
          title_ar: استهلاك الطاقة الكهربائية في المساكن حسب فترة الاستهلاك والمناطق الإدارية
          title_en: >-
            Housing units electrical energy consumption by season and region
          description: >-
            الكميات المستهلكة من الطاقة الكهربائية بالكيلوواط في المساكن، خلال
            فصل الشتاء (ديسمبر ويناير وفبراير) وباقي السنة. السنوات المتاحة عند
            الفحص: 2017-2019 و2021-2022 (لا يوجد 2020). قيمة القياس في العمود
            OBSVALUE_OBSV.
          keywords: >-
            استهلاك الكهرباء استهلاك الطاقة الكهربائية كيلوواط المساكن الأحمال
            electricity consumption
          dimensions: [CONSUMP_OPERATION_PERIOD, REGION, YEAR]
          topics: [electricity, energy, housing]
    # Credential LOCATIONS only; values live in the environment. Optional
    # here, since the Public APIs are anonymous.
    auth:
      type: api_key
      key_env: GASTAT_API_KEY
      secret_env: GASTAT_API_SECRET
      header: apikey
    # Every topic GASTAT publishes: which datasets exist is decided by the
    # specs in spec_dir, and a search with no matching dataset is local and
    # returns nothing, so listing a topic here costs no request.
    topics: [population, labour, prices, gdp, trade, education, health, tourism,
             transport, environment, housing, energy, electricity, water, ict,
             agriculture, finance, business, research, culture]

