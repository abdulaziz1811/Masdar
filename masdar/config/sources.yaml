# Registry of official Saudi data publishers.
#
# `authority` (0-100) is how close the publisher is to being the origin of
# the statistic, not how nice its website is. The ranker uses it to break
# ties between datasets that match a query equally well.
#
# `api_verified` records whether the endpoint shape below was confirmed
# against the live service. Anything false is a documented expectation, not
# a promise -- run `masdar doctor` from a network that can reach the host to
# confirm, and correct this file from what comes back.
#
# ACCESS FACTS, checked 2026-09-27 from a Saudi egress address.
# `geo_restricted: true` is asserted only where it was actually demonstrated;
# everything else that is merely likely is written in access_notes_ar.
#
#   * open.data.gov.sa is GEO-RESTRICTED: every fetch from non-Saudi exits
#     failed across several engines, and the same URL returned HTTP 200 from
#     a Saudi exit. www.stats.gov.sa likewise answered from a Saudi exit; it
#     was not tested from outside, so its restriction is inferred, not
#     verified. The other hosts were not reachable from the build container
#     at all -- but that is this environment's own egress policy denying
#     *.gov.sa, which proves nothing either way about geo-restriction. Only
#     `geo_restricted: true` below means verified.
#     Set MASDAR_HTTP_BACKEND=firecrawl (see masdar/sources/http.py) to route
#     through a Saudi exit, or run Masdar from inside the Kingdom.
#   * open.data.gov.sa sits behind a WAF that answers "Request Rejected" with
#     a support ID for requests it does not consider browser-like. Page
#     navigations pass; direct /data/api/... paths were rejected. The API
#     path below is therefore still UNCONFIRMED.
#   * open.data.gov.sa is an Angular single-page app. Its dataset list is
#     fetched over XHR, so scraping its HTML returns an empty shell. It needs
#     the JSON API, which is why its adapter is not html_index.
#   * www.stats.gov.sa (GASTAT) is a server-rendered Liferay portal and does
#     return real HTML, including facet counts (4113 data tables, 1418
#     bulletins, 60 API entries; year facets 2016-2025 as of the check).
#     Its result rows come from a namespaced Liferay portlet parameter that
#     `?q=` alone does not drive -- see search_path below.

version: 1

sources:
  - id: saudi_open_data
    name_ar: البوابة الوطنية للبيانات المفتوحة
    name_en: Saudi Open Data Portal
    operator_ar: الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا)
    operator_en: SDAIA
    base_url: https://open.data.gov.sa
    adapter: saudi_open_data
    authority: 90
    api_verified: false
    rendering: spa
    geo_restricted: true
    waf: true
    access_checked: "2026-09-27"
    access_notes_ar: >-
      وصلنا للصفحات عبر منفذ سعودي (HTTP 200)، لكن مسارات /data/api/... رُفضت
      من جدار الحماية برسالة "Request Rejected". المسار أدناه غير مؤكَّد.
      أسرع طريقة لتأكيده: افتح open.data.gov.sa/ar/datasets في المتصفح ثم
      أدوات المطور ← Network ← فلتر XHR، وسيظهر المسار الحقيقي فوراً.
    api:
      # UNCONFIRMED -- rejected by the WAF when called directly. Correct this
      # from the browser's network tab, then set api_verified: true.
      dataset_search: /data/api/v1/datasets
      dataset_detail: /data/api/v1/datasets/{id}
      # Portal UI language is switched by path segment, mirrored by the API.
      languages: [ar, en]
    notes_ar: >-
      المنصة الوطنية الجامعة لبيانات الجهات الحكومية، وهي أول نقطة بحث لأنها
      توفر ملفات جاهزة (CSV/XLSX) وبيانات وصفية عن تاريخ التحديث.
    topics: [electricity, energy, population, labour, education, health, water,
             housing, trade, prices, tourism, transport, environment, gdp, ict,
             agriculture]

  - id: gastat
    name_ar: الهيئة العامة للإحصاء
    name_en: General Authority for Statistics (GASTAT)
    operator_ar: الهيئة العامة للإحصاء
    operator_en: GASTAT
    base_url: https://www.stats.gov.sa
    adapter: html_index
    authority: 100
    api_verified: false
    rendering: server
    access_checked: "2026-09-27"
    access_notes_ar: >-
      بوابة Liferay تُرجع HTML حقيقياً عبر منفذ سعودي (لم تُجرَّب من خارج
      المملكة، فالتقييد الجغرافي مُستنتج لا مُتحقَّق). عدّادات التصنيفات
      تظهر (جداول البيانات 4113، النشرات 1418، APIs 60، وسنوات 2016-2025)،
      لكن صفوف النتائج تحتاج معامل البورتلت المُسمّى ولا يكفي ?q=. كما أن
      تصنيف "APIs" فيه 60 مدخلاً يستحق الفحص كمسار بيانات مباشر.
    api:
      # Liferay faceted search. `{query}` is substituted by the adapter.
      publications_index: /ar/statistics-tabs
      search_path: /ar/statistics-tabs?q={query}&delta=60
      database_portal: https://database.stats.gov.sa
      # Liferay serves attachments from this prefix.
      document_prefix: /documents/
    notes_ar: >-
      الجهة الرسمية المسؤولة عن الإحصاءات الوطنية. تصدر نشرات سنوية وربعية،
      وعادة ما تكون المرجع النهائي عند تعارض الأرقام.
    topics: [population, labour, prices, gdp, trade, education, health, tourism,
             transport, environment, housing, energy, electricity, water, ict,
             agriculture, finance]

  - id: wera
    name_ar: هيئة تنظيم المياه والكهرباء
    name_en: Water and Electricity Regulatory Authority
    operator_ar: هيئة تنظيم المياه والكهرباء
    operator_en: WERA
    base_url: https://wera.gov.sa
    adapter: html_index
    authority: 95
    api_verified: false
    api:
      publications_index: /
    notes_ar: >-
      المنظّم لقطاعي الكهرباء والمياه، ويصدر التقارير الإحصائية السنوية
      للكهرباء (الأحمال، الاستهلاك، المشتركون) موزعة جغرافياً.
    topics: [electricity, water, energy]

  - id: moenergy
    name_ar: وزارة الطاقة
    name_en: Ministry of Energy
    operator_ar: وزارة الطاقة
    operator_en: Ministry of Energy
    base_url: https://www.moenergy.gov.sa
    adapter: html_index
    authority: 85
    api_verified: false
    api:
      publications_index: /
    notes_ar: مصدر السياسات وبيانات قطاع الطاقة والكهرباء والطاقة المتجددة.
    topics: [energy, electricity]

  - id: sama
    name_ar: البنك المركزي السعودي
    name_en: Saudi Central Bank (SAMA)
    operator_ar: البنك المركزي السعودي
    operator_en: SAMA
    base_url: https://www.sama.gov.sa
    adapter: html_index
    authority: 95
    api_verified: false
    api:
      publications_index: /ar-sa/EconomicReports
    notes_ar: النشرات الإحصائية النقدية والمصرفية وميزان المدفوعات.
    topics: [prices, gdp, trade, finance]

  - id: saudi_census
    name_ar: تعداد السعودية
    name_en: Saudi Census
    operator_ar: الهيئة العامة للإحصاء
    operator_en: GASTAT
    base_url: https://portal.saudicensus.sa
    adapter: html_index
    authority: 100
    api_verified: false
    api:
      publications_index: /
    notes_ar: نتائج التعداد العام للسكان والمساكن بتفصيل جغرافي عميق.
    topics: [population, housing]

  - id: moh
    name_ar: وزارة الصحة
    name_en: Ministry of Health
    operator_ar: وزارة الصحة
    operator_en: Ministry of Health
    base_url: https://www.moh.gov.sa
    adapter: html_index
    authority: 85
    api_verified: false
    api:
      publications_index: /ar/Ministry/Statistics/book/Pages/default.aspx
    notes_ar: الكتاب الإحصائي الصحي السنوي وبيانات المنشآت الصحية.
    topics: [health]

  - id: mewa
    name_ar: وزارة البيئة والمياه والزراعة
    name_en: Ministry of Environment, Water and Agriculture
    operator_ar: وزارة البيئة والمياه والزراعة
    operator_en: MEWA
    base_url: https://www.mewa.gov.sa
    adapter: html_index
    authority: 85
    api_verified: false
    api:
      publications_index: /ar/InformationCenter/Researchs/Reports/Pages/default.aspx
    notes_ar: إحصاءات المياه والزراعة والبيئة.
    topics: [water, agriculture, environment]

  - id: gastat_db
    name_ar: قاعدة بيانات الهيئة العامة للإحصاء
    name_en: GASTAT statistical database
    operator_ar: الهيئة العامة للإحصاء
    operator_en: GASTAT
    base_url: https://database.stats.gov.sa
    adapter: gastat_api
    authority: 100
    # VERIFIED by direct call on 2026-09-27: HTTP 200, application/json,
    # anonymous. See masdar/sources/adapters/gastat_api.py for the shapes.
    api_verified: true
    access_checked: "2026-09-27"
    access_notes_ar: >-
      واجهة مؤشرات مفتوحة بلا مفتاح. تم التحقق من cardsinfo مباشرةً (يعيد
      {"info": [...]} مع ar_title/en_title وfrequency)، ومن أن indicators/public
      يعيد JSON بحالة 200 (نحو 2600 مؤشر، ~4.5 ميغابايت). لا يوجد بحث من جهة
      الخدمة — جدار الحماية يرفض معاملات الاستعلام على الفهرس — فالتصفية تحدث
      محلياً بعد جلب الفهرس مرة واحدة. حقول frequency تعني التكرار (سنوي/شهري)
      ولا تدل على السنوات المتاحة، فالسنوات تُستخرج من البيانات نفسها.
    api:
      catalog: /gastatapi/portal/api/v1/indicators/public
      headlines: /gastatapi/portal/api/v1/indicators/cardsinfo
      observations: /gastatapi/portal/api/v1/indicators/getDataForChart
    topics: [population, labour, prices, gdp, trade, education, health, tourism,
             transport, environment, housing, energy, electricity, water, ict,
             agriculture, finance]

  - id: gastat_cdata
    name_ar: واجهة إحصاءات الهيئة العامة للإحصاء (cdata)
    name_en: GASTAT cdata statistics API
    operator_ar: الهيئة العامة للإحصاء
    operator_en: GASTAT
    base_url: https://api.stats.gov.sa
    adapter: gastat_cdata
    authority: 100
    # VERIFIED by direct call on 2026-09-27: HTTP 200, application/json, and
    # anonymous -- the "Public" APIs need no key. Spec is OpenAPI 3.0, served
    # from the GASTAT developer portal.
    api_verified: true
    access_checked: "2026-09-27"
    access_notes_ar: >-
      أفضل مسار بيانات مؤكَّد حتى الآن. التجميع يحدث في الخادم عبر
      dimensions[]، فطلب "حسب المناطق" يُنفَّذ مباشرة لا بمعالجة لاحقة.
      واستعلام dimensions[]=YEAR وحده يُعيد صفاً لكل سنة متاحة، فيُستخرج
      نطاق التغطية بتكلفة صفوف قليلة وبدليل من المصدر نفسه. الأعمدة موسومة
      بدورها: YEAR_TIME للفترة، و*_OBSV للقيم، و*_ARAB/*_ENGL/*_CODE
      لمسميات التصنيفات. تدعم أيضاً format=CSV وHTML و$top/$skip/$orderby.
      الواجهات العامة لا تحتاج مفتاحاً؛ يُرسل المفتاح فقط إن كان مُعيَّناً
      في البيئة، لواجهة تطلبه.
    api:
      dataset_path: /v1/stats/{id}
      # No catalogue endpoint exists, so datasets are declared here. Add one
      # by copying its id and dimensions from the portal's API page.
      datasets:
        - id: DPV_HES_EHE_IT_HES0301
          title_ar: المساكن المتصلة بالكهرباء حسب مصدر الكهرباء ونوع الحيازة والمنطقة الإدارية
          title_en: >-
            Housing units with electricity connection by network, tenure type
            and region
          description: >-
            نسبة المساكن المتصلة بالكهرباء من إجمالي المساكن. السنوات المتاحة
            عند الفحص: 2017-2019 و2021-2022 (لا يوجد 2020).
          keywords: كهرباء الطاقة الكهربائية مساكن توصيل الكهرباء
          dimensions: [ELECTRICITY_NETWORK_TYPE, HOUSE_TYPE, POSSESSION_TYPE,
                       REGION, YEAR]
          topics: [electricity, energy, housing]
        - id: DPV_HES_EHE_IT_HES0303
          title_ar: استهلاك الطاقة الكهربائية في المساكن حسب فترة الاستهلاك والمناطق الإدارية
          title_en: >-
            Housing units electrical energy consumption by season and region
          description: >-
            الكميات المستهلكة من الطاقة الكهربائية بالكيلوواط في المساكن، خلال
            فصل الشتاء (ديسمبر ويناير وفبراير) وباقي السنة. السنوات المتاحة عند
            الفحص: 2017-2019 و2021-2022 (لا يوجد 2020). قيمة القياس في العمود
            OBSVALUE_OBSV.
          keywords: >-
            استهلاك الكهرباء استهلاك الطاقة الكهربائية كيلوواط المساكن الأحمال
            electricity consumption
          dimensions: [CONSUMP_OPERATION_PERIOD, REGION, YEAR]
          topics: [electricity, energy, housing]
    # Credential LOCATIONS only; values live in the environment. Optional
    # here, since the Public APIs are anonymous.
    auth:
      type: api_key
      key_env: GASTAT_API_KEY
      secret_env: GASTAT_API_SECRET
      header: apikey
    topics: [electricity, energy, housing]
