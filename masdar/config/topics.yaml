# Phrases that contain a topic word without being about that topic. They
# are removed before a title is labelled with topics: GNI "بالأسعار الجارية"
# (at current prices) is national accounts, not prices or inflation.
qualifiers: [بالأسعار الجارية, بالأسعار الثابتة, بالاسعار الجارية, بالاسعار الثابتة,
             الأسعار الجارية, الأسعار الثابتة, at current prices, at constant prices,
             current prices, constant prices]

# Words that signal a breakdown axis rather than a subject.
dimensions:
  region: [المناطق, منطقة, مناطق, حسب المناطق, المنطقة الإدارية, الإمارات, جغرافيا, جغرافي, region, regions, by region, administrative region, governorates, geographic]
  city: [المدن, مدينة, مدن, حسب المدن, المحافظات, محافظة, city, cities, by city, governorate, municipality]
  sector: [القطاع, قطاع, القطاعات, حسب القطاع, النشاط الاقتصادي, sector, sectors, by sector, economic activity]
  gender: [الجنس, ذكور, إناث, حسب الجنس, رجال, نساء, gender, sex, male, female, by gender]
  nationality: [الجنسية, غير سعودي, غير السعوديين, سعودي وغير سعودي, حسب الجنسية,
                الوافدين, nationality, saudi, non-saudi, expatriates, by nationality]
  age: [العمر, الفئات العمرية, حسب العمر, فئة عمرية, age, age group, age groups, by age]
  month: [شهري, الشهور, حسب الشهر, شهرياً, الأشهر, month, monthly, months, by month]
  quarter: [ربعي, الربع, ربع سنوي, الأرباع, حسب الربع, quarter, quarterly, quarters, by quarter]
  season: [الفصل, فصل, الفصول, حسب الفصل, الشتاء, شتاء, الصيف, صيف,
           موسمي, موسم, season, seasonal, winter, summer]
  activity: [النشاط, الأنشطة, حسب النشاط, activity, activities, by activity]

