# Canonical topics and the words users actually type for them.
#
# Keywords are matched after Arabic normalisation (diacritics removed, hamza
# and ta-marbuta folded), so write them in plain spelling. Add synonyms
# freely -- extra keywords only ever widen recall for a topic.

version: 1

topics:
  - id: electricity
    label_ar: الطاقة الكهربائية
    label_en: Electricity
    keywords_ar: [كهرباء, الكهرباء, كهربائية, الطاقة الكهربائية, استهلاك الكهرباء,
                  مشتركي الكهرباء, الأحمال الكهربائية, توليد الكهرباء, شبكة الكهرباء]
    keywords_en: [electricity, power consumption, electric load, power generation]
    preferred_sources: [gastat_cdata, kapsarc, wera, gastat_db, saudi_open_data, moenergy, gastat]

  - id: energy
    label_ar: الطاقة
    label_en: Energy
    keywords_ar: [الطاقة, النفط, الغاز, الطاقة المتجددة, البتروكيماويات, وقود]
    keywords_en: [energy, oil, gas, renewable energy, fuel]
    preferred_sources: [gastat_cdata, kapsarc, gastat_db, moenergy, saudi_open_data, gastat]

