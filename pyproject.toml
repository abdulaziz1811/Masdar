[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masdar"
version = "0.1.0"
description = "وكيل بحث في البيانات المفتوحة الرسمية السعودية — يجيب فقط بما يمكنه إثباته"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
masdar = "masdar.cli:main"

[tool.setuptools.packages.find]
include = ["masdar*"]

[tool.setuptools.package-data]
masdar = ["config/*.yaml", "config/specs/*/*.json", "config/specs/*/*.yaml",
          "config/specs/*/*.md", "fixtures/*.yaml", "fixtures/*/*.json", "fixtures/*/*.csv",
          "chat/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM"]
